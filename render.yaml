services:
  - type: web
    name: studybee-bracu-resource-hub
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /

    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: BREVO_API_KEY
        sync: false

      - key: BREVO_SENDER_EMAIL
        sync: false

      - key: BREVO_SENDER_NAME
        value: StudyBee

      - key: USE_CLOUD_STORAGE
        value: "True"

      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false

      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false

      - key: SUPABASE_S3_BUCKET_NAME
        value: studybee-resources

      - key: SUPABASE_S3_ENDPOINT_URL
        value: https://isjkgmemduxtviksfnji.storage.supabase.co/storage/v1/s3

      - key: SUPABASE_S3_REGION
        value: ap-southeast-1

      - key: SUPABASE_PUBLIC_MEDIA_URL
        value: https://isjkgmemduxtviksfnji.supabase.co/storage/v1/object/public/studybee-resources

      - key: ALLOWED_HOSTS
        value: .onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com

      - key: SECURE_SSL_REDIRECT
        value: "True"

      - key: SESSION_COOKIE_SECURE
        value: "True"

      - key: CSRF_COOKIE_SECURE
        value: "True"

      - key: SECURE_HSTS_SECONDS
        value: "3600"
